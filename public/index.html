<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWS DevOps To-Do</title><style>body{font-family:Arial;background:#f4f7fb;margin:0}.box{max-width:760px;margin:50px auto;background:#fff;padding:30px;border-radius:14px;box-shadow:0 8px 30px #0001}form{display:flex;gap:10px}input[type=text]{padding:12px;flex:1;border:1px solid #ccc;border-radius:8px}button{padding:10px 14px;border:0;border-radius:7px;background:#16a34a;color:white;cursor:pointer}.edit{background:#4b5563}.delete{background:#dc2626}li{display:flex;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.title{flex:1}.completed{text-decoration:line-through;color:#999}.actions{display:flex;gap:6px}.health{margin-top:20px;color:#666}@media(max-width:600px){form{flex-direction:column}}</style></head><body><div class="box"><h1>AWS DevOps To-Do</h1><p>Simple To-Do application for the DevOps practical assessment.</p><form id="f"><input id="i" type="text" placeholder="Enter a task..." required><button>Add Task</button></form><ul id="l"></ul><div class="health" id="h">Checking health...</div></div><script>async function load(){const r=await fetch('/api/tasks'),a=await r.json(),l=document.querySelector('#l');l.innerHTML='';if(!a.length){l.innerHTML='<li>No tasks yet. Add your first task.</li>';return}a.forEach(t=>{const li=document.createElement('li'),c=document.createElement('input'),s=document.createElement('span'),d=document.createElement('div'),e=document.createElement('button'),x=document.createElement('button');c.type='checkbox';c.checked=t.completed;c.onchange=()=>update(t.id,{completed:c.checked});s.textContent=t.title;s.className='title'+(t.completed?' completed':'');e.textContent='Edit';e.className='edit';e.onclick=async()=>{const n=prompt('Update task:',t.title);if(n!==null)await update(t.id,{title:n})};x.textContent='Delete';x.className='delete';x.onclick=async()=>{if(confirm('Delete this task?')){await fetch('/api/tasks/'+t.id,{method:'DELETE'});load()}};d.className='actions';d.append(e,x);li.append(c,s,d);l.append(li)})}async function update(id,b){await fetch('/api/tasks/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});load()}document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const i=document.querySelector('#i');await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:i.value})});i.value='';load()};fetch('/health').then(r=>r.json()).then(x=>document.querySelector('#h').textContent='Service health: '+x.status.toUpperCase());load();</script></body></html>
